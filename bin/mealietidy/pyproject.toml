[project]
name = "mealietidy"
version = "0.1.0"
description = "A script to translate and manage Mealie data."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "yachalk>=0.1.8",
]

[project.scripts]
mealietidy = "mealietidy.cli:main"

[build-system]
requires = ["uv-build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-exclude = [".venv"]
wheel-exclude = [".venv"]

[tool.ruff]
src = [".", "tests"]

[tool.poe.tasks.test]
help = "Run all tests against a fresh, seeded local Mealie instance"
cmd = "python scripts/run_tests.py"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "ruff>=0.17.0",
]
